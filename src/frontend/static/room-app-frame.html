<!doctype html>
<!-- A group app's frame. room-app-host.js loads this page into a sandboxed iframe and
     hands it the app page from the group server. The app then runs under this page's
     policy, not the embedding page's. Also vendored as ClawCrossHub/public/room-app-frame.html.

     The app reaches the group through window.ClawCrossRoomApp:
       onSnapshot(fn)            the group (members, who is looking) and messages not seen yet
       send(content, mentions)   posts a group message; mentioned agents are woken
       history()                 every message of the group
       configure(announcement)   the owner sets the group announcement -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<script>
(() => {
  'use strict';
  addEventListener('message', function connect(event) {
    // App HTML only ever runs inside an opaque-origin sandbox, never as this site.
    if (self.origin !== 'null' || event.source !== parent || !event.data || event.data.type !== 'clawcross.room-app.connect' ||
        typeof event.data.html !== 'string' || !event.ports[0]) return;
    removeEventListener('message', connect);
    const port = event.ports[0], waiting = new Map(), listeners = new Set();
    let state = null, seq = 0;
    function call(method, args) {
      return new Promise((resolve, reject) => {
        const id = 'app:' + (++seq);
        const timer = setTimeout(() => { waiting.delete(id); reject(new Error('请求超时')); }, 30000);
        waiting.set(id, {resolve, reject, timer});
        port.postMessage({id, method, args});
      });
    }
    port.onmessage = ({data}) => {
      if (data.event === 'snapshot') { state = data.value; for (const fn of listeners) fn(state); return; }
      const item = waiting.get(data.reply);
      if (!item) return;
      waiting.delete(data.reply); clearTimeout(item.timer);
      if (data.error) item.reject(new Error(data.error)); else item.resolve(data.result);
    };
    window.ClawCrossRoomApp = Object.freeze({
      version: 1,
      onSnapshot(fn) { listeners.add(fn); if (state) fn(state); return () => listeners.delete(fn); },
      send(content, mentions) { return call('send', {content, mentions: mentions || []}); },
      history() { return call('history', {}); },
      configure(announcement) { return call('configure', {announcement}); }
    });
    document.open();
    document.write(event.data.html);
    document.close();
  });
})();
</script>
